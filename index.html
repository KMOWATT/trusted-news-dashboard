<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daily News — Trusted Sources</title>
<style>
:root{--bg:#f5f5f3;--paper:#fff;--ink:#151515;--muted:#777;--line:#deded9}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
header{position:sticky;top:0;z-index:10;background:#f5f5f3ee;backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.wrap{max-width:980px;margin:auto;padding:18px 22px}header .wrap{padding-bottom:10px}
.head{display:flex;justify-content:space-between;align-items:center}.brand{font-size:21px;font-weight:800;letter-spacing:-.03em}.status{font-size:12px;color:var(--muted)}
.controls{display:flex;gap:7px;flex-wrap:wrap;padding-top:13px}button{border:1px solid var(--line);background:var(--paper);padding:7px 12px;border-radius:999px;font:inherit;font-size:12px;cursor:pointer}
button.active{background:#111;color:#fff;border-color:#111}main{padding-top:25px;padding-bottom:70px}
.meta{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;margin-bottom:9px}
.story{background:var(--paper);border:1px solid var(--line);border-radius:13px;padding:17px 18px;margin:10px 0}.story.read{opacity:.42}
.row{display:flex;gap:15px}.body{flex:1}h2{font-size:17px;line-height:1.3;margin:0 0 6px}h2 a{color:inherit;text-decoration:none}h2 a:hover{text-decoration:underline}
.desc{font-size:13px;color:#555;margin:0 0 9px}.by{font-size:11px;color:var(--muted);display:flex;gap:7px;flex-wrap:wrap}.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
.tag,.deep{border-radius:5px;padding:3px 7px;font-size:10px;border:1px solid var(--line);background:#fafafa}.deep{background:#111;color:#fff;border-color:#111;font-weight:800;letter-spacing:.05em}
.read{white-space:nowrap;font-size:11px;color:var(--muted)}.empty{text-align:center;color:var(--muted);padding:60px 20px}
@media(max-width:600px){.wrap{padding-left:14px;padding-right:14px}.story{padding:14px}.row{gap:8px}h2{font-size:16px}}
</style></head><body>
<header><div class="wrap"><div class="head"><div class="brand">Daily News</div><div class="status" id="status">Loading…</div></div>
<div class="controls"><button class="active" data-range="today">Today</button><button data-range="week">This Week</button>
<button class="active" data-topic="all">All</button><button data-topic="International">International</button><button data-topic="Climate">Climate</button><button data-topic="Investigative">Investigative</button><button data-topic="Far-Right/Politics">Far-Right/Politics</button></div></div></header>
<main class="wrap"><div class="meta"><span id="count"></span><button id="unread">Show unread only</button></div><section id="feed"></section></main>
<script>
let articles=[],range="today",topic="all",unread=false;const KEY="trusted-news-read-v2",read=new Set(JSON.parse(localStorage.getItem(KEY)||"[]"));
const $=s=>document.querySelector(s), feed=$("#feed");
function day(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function list(){let now=new Date(),start=day(now);if(range==="week"){start.setDate(start.getDate()-6)}
return articles.filter(a=>new Date(a.published)>=start&&(topic==="all"||a.topics.includes(topic))&&(!unread||!read.has(a.id))).sort((a,b)=>new Date(b.published)-new Date(a.published))}
function esc(s){return String(s||"").replace(/[&<>"']/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[x]))}
function render(){let xs=list();$("#count").textContent=`${xs.length} ${xs.length===1?"story":"stories"}`;$("#unread").textContent=unread?"Show all":"Show unread only";
feed.innerHTML=xs.length?xs.map(a=>`<article class="story ${read.has(a.id)?"read":""}"><div class="row"><div class="body"><h2><a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.title)}</a></h2>${a.description?`<p class="desc">${esc(a.description)}</p>`:""}<div class="by"><span>${esc(a.source)}</span><span>·</span><span>${new Date(a.published).toLocaleString([], {day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}</span></div><div class="tags">${a.deep_dive?'<span class="deep">DEEP DIVE</span>':""}${a.topics.map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div></div><label class="read"><input type="checkbox" data-id="${a.id}" ${read.has(a.id)?"checked":""}> Read</label></div></article>`).join(""):'<div class="empty">No stories match these filters.</div>';
feed.querySelectorAll("input").forEach(x=>x.onchange=()=>{x.checked?read.add(x.dataset.id):read.delete(x.dataset.id);localStorage.setItem(KEY,JSON.stringify([...read]));render()})}
document.querySelectorAll("[data-range]").forEach(b=>b.onclick=()=>{range=b.dataset.range;document.querySelectorAll("[data-range]").forEach(x=>x.classList.remove("active"));b.classList.add("active");render()});
document.querySelectorAll("[data-topic]").forEach(b=>b.onclick=()=>{topic=b.dataset.topic;document.querySelectorAll("[data-topic]").forEach(x=>x.classList.remove("active"));b.classList.add("active");render()});
$("#unread").onclick=()=>{unread=!unread;render()};
fetch("./data/articles.json?"+Date.now()).then(r=>r.json()).then(x=>{articles=x;$("#status").textContent=`${x.length} stories available`;render()}).catch(()=>{$("#status").textContent="Feed unavailable";feed.innerHTML='<div class="empty">Run the Python updater, then refresh.</div>'});
</script></body></html>
